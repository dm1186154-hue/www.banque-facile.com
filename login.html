<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion | Banque Facile</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0757a0, #087ee8, #0ba4e8);

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 25px;
        }

        .login-card {
            width: 100%;
            max-width: 480px;

            background: #ffffff;

            border-radius: 25px;

            padding: 45px 35px;

            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.20);

            text-align: center;
        }

        /* LOGO */

        .logo {
            width: 95px;
            height: 95px;

            object-fit: contain;

            margin-bottom: 20px;
        }

        /* TITRE */

        h1 {
            color: #0757a0;

            font-size: 32px;

            margin-bottom: 10px;
        }

        .subtitle {
            color: #687386;

            font-size: 16px;

            margin-bottom: 30px;
        }

        /* FORMULAIRE */

        .form-group {
            text-align: left;

            margin-bottom: 20px;
        }

        .form-group label {
            display: block;

            color: #172033;

            font-size: 15px;

            font-weight: 700;

            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;

            padding: 15px;

            border: 1px solid #dce3ec;

            border-radius: 10px;

            font-size: 16px;

            outline: none;

            transition: 0.2s;
        }

        .form-group input:focus {
            border-color: #087ee8;

            box-shadow: 0 0 0 3px rgba(8, 126, 232, 0.10);
        }

        /* MOT DE PASSE */

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 55px;
        }

        .show-password {
            position: absolute;

            right: 15px;
            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: transparent;

            cursor: pointer;

            font-size: 20px;
        }

        /* MOT DE PASSE OUBLIE */

        .forgot {
            text-align: right;

            margin-top: -8px;

            margin-bottom: 25px;
        }

        .forgot a {
            color: #087ee8;

            text-decoration: none;

            font-size: 14px;

            font-weight: 600;
        }

        /* BOUTON */

        .login-button {
            width: 100%;

            border: none;

            background: #087ee8;

            color: white;

            padding: 16px;

            border-radius: 10px;

            font-size: 17px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s;
        }

        .login-button:hover {
            background: #0757a0;

            transform: translateY(-1px);
        }

        /* INSCRIPTION */

        .register {
            margin-top: 25px;

            color: #687386;

            font-size: 15px;
        }

        .register a {
            color: #087ee8;

            text-decoration: none;

            font-weight: 700;
        }

        /* RETOUR */

        .back-home {
            display: inline-block;

            margin-top: 25px;

            color: #0757a0;

            text-decoration: none;

            font-size: 14px;
        }

        /* MOBILE */

        @media (max-width: 500px) {

            body {
                padding: 15px;
            }

            .login-card {
                padding: 35px 22px;

                border-radius: 20px;
            }

            h1 {
                font-size: 27px;
            }

            .logo {
                width: 80px;
                height: 80px;
            }
        }
    </style>
</head>

<body>

    <main class="login-card">

        <!-- LOGO -->

        <img
            class="logo"
            src="https://i.postimg.cc/yxKxf5qf/file-000000009b7861f78b615a6a6fe8ae03.png"
            alt="Logo Banque Facile"
        >

        <!-- TITRE -->

        <h1>
            Connexion
        </h1>

        <p class="subtitle">
            Connectez-vous à votre espace Banque Facile
        </p>


        <!-- FORMULAIRE -->

        <form id="loginForm">

            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Adresse e-mail
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="exemple@email.com"
                    required
                >

            </div>


            <!-- MOT DE PASSE -->

            <div class="form-group">

                <label for="password">
                    Mot de passe
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Votre mot de passe"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword()"
                        aria-label="Afficher le mot de passe"
                    >
                        👁️
                    </button>

                </div>

            </div>


            <!-- MOT DE PASSE OUBLIE -->

            <div class="forgot">

                <a href="#">
                    Mot de passe oublié ?
                </a>

            </div>


            <!-- BOUTON -->

            <button
                type="submit"
                class="login-button"
            >
                Se connecter
            </button>

        </form>


        <!-- INSCRIPTION -->

        <p class="register">

            Vous n'avez pas encore de compte ?

            <a href="inscription.html">
                Créer un compte
            </a>

        </p>


        <!-- RETOUR -->

        <a
            href="index.html"
            class="back-home"
        >
            ← Retour à l'accueil
        </a>

    </main>


    <script>

        function togglePassword() {

            const password =
                document.getElementById("password");

            if (password.type === "password") {

                password.type = "text";

            } else {

                password.type = "password";

            }
        }

    </script>

</body>

</html>
