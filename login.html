<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion | Banque Facile</title>

    <meta
        name="description"
        content="Connectez-vous à votre espace bancaire Banque Facile."
    >

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0066cc, #00a8e8);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .container {
            width: 100%;
            max-width: 520px;
        }

        .card {
            background: #ffffff;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.20);
        }

        .logo-container {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo {
            width: 90px;
            height: 90px;
            object-fit: contain;
            display: block;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #0067b9;
            font-size: 36px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #172033;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            height: 55px;
            border: 1px solid #d5dce5;
            border-radius: 12px;
            padding: 0 16px;
            font-size: 16px;
            outline: none;
            transition: 0.2s;
            background: #ffffff;
        }

        input:focus {
            border-color: #0074d9;
            box-shadow: 0 0 0 3px rgba(0, 116, 217, 0.12);
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 55px;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 20px;
        }

        #loginButton {
            width: 100%;
            height: 56px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #006dcc, #008fe5);
            color: white;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }

        #loginButton:hover {
            transform: translateY(-1px);
            opacity: 0.95;
        }

        #loginButton:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .form-message {
            display: none;
            margin-top: 18px;
            padding: 14px;
            border-radius: 10px;
            text-align: center;
            font-size: 15px;
            line-height: 1.4;
        }

        .form-message.error {
            display: block;
            color: #b42318;
            background: #fef3f2;
            border: 1px solid #fecdca;
        }

        .form-message.success {
            display: block;
            color: #067647;
            background: #ecfdf3;
            border: 1px solid #abefc6;
        }

        .form-message.loading {
            display: block;
            color: #175cd3;
            background: #eff8ff;
            border: 1px solid #b2ddff;
        }

        .links {
            text-align: center;
            margin-top: 25px;
            color: #64748b;
            line-height: 1.8;
        }

        .links a {
            color: #006dcc;
            font-weight: 700;
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .security {
            margin-top: 25px;
            padding: 15px;
            background: #f8fafc;
            border-radius: 12px;
            text-align: center;
            color: #64748b;
            font-size: 13px;
            line-height: 1.5;
        }

        @media (max-width: 600px) {

            .card {
                padding: 25px 20px;
                border-radius: 18px;
            }

            h1 {
                font-size: 29px;
            }

            body {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <!-- LOGO -->
        <div class="logo-container">
            <img
                class="logo"
                src="https://i.postimg.cc/yxKxf5qf/file-000000009b7861f78b615a6a6fe8ae03.png"
                alt="Logo Banque Facile"
            >
        </div>

        <!-- TITRE -->
        <h1>Se connecter</h1>

        <p class="subtitle">
            Connectez-vous à votre espace Banque Facile
            pour accéder à vos services.
        </p>

        <!-- FORMULAIRE -->
        <form id="loginForm" novalidate>

            <!-- EMAIL -->
            <div class="form-group">

                <label for="email">
                    Adresse e-mail
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="exemple@gmail.com"
                    autocomplete="email"
                    required
                >

            </div>

            <!-- MOT DE PASSE -->
            <div class="form-group">

                <label for="password">
                    Mot de passe
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Votre mot de passe"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        id="togglePassword"
                        class="toggle-password"
                        aria-label="Afficher le mot de passe"
                    >
                        👁️
                    </button>

                </div>

            </div>

            <!-- MESSAGE -->
            <div
                id="loginMessage"
                class="form-message"
                role="alert"
                aria-live="polite"
            ></div>

            <!-- BOUTON -->
            <button
                type="submit"
                id="loginButton"
            >
                🔐 Se connecter
            </button>

        </form>

        <!-- LIENS -->
        <div class="links">

            <p>
                Vous n'avez pas encore de compte ?
                <a href="inscription.html">
                    Créer un compte
                </a>
            </p>

            <p>
                <a href="index.html">
                    ← Retour à l'accueil
                </a>
            </p>

        </div>

        <!-- SECURITE -->
        <div class="security">
            🔐 <strong>Connexion sécurisée</strong><br>
            Vos informations d'authentification sont protégées
            par Firebase Authentication.
        </div>

    </div>

</div>


<!-- JAVASCRIPT -->
<script
    type="module"
    src="connexion.js">
</script>

</body>
</html>
