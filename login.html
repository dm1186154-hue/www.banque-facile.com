<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion | Banque Facile</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="page">

        <section class="welcome-card">

            <!-- LOGO -->
            <img
                src="assets/banque_app_logo_final.jpg"
                alt="Logo Banque Facile"
                class="logo"
            >

            <!-- TITRE -->
            <h1>
                Connexion<br>
                <span>Banque Facile</span>
            </h1>

            <p class="description">
                Connectez-vous à votre espace personnel.
            </p>


            <!-- FORMULAIRE -->
            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Adresse e-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Votre adresse e-mail"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Mot de passe
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Votre mot de passe"
                        required
                    >

                </div>


                <div class="forgot-password">

                    <a href="#">
                        Mot de passe oublié ?
                    </a>

                </div>


                <button
                    type="submit"
                    class="btn-login"
                >
                    Se connecter
                </button>


                <div
                    id="loginMessage"
                    class="form-message"
                ></div>

            </form>


            <!-- INSCRIPTION -->

            <p class="register-text">

                Pas encore de compte ?

                <a href="inscription.html">
                    Créer un compte
                </a>

            </p>


            <!-- RETOUR -->

            <a
                href="index.html"
                class="back-home"
            >
                ← Retour à l'accueil
            </a>

        </section>

    </main>


    <!-- JAVASCRIPT -->

    <script type="module" src="js/auth.js"></script>

</body>

</html>
