<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Envoyer de l'argent | Banque Facile</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #07111f, #0d2238);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 22px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        .logo {
            display: block;
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin: 0 auto 15px;
            border-radius: 20px;
        }

        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #b9c6d4;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .user-box {
            background: rgba(255, 255, 255, 0.07);
            border-radius: 12px;
            padding: 12px 15px;
            margin-bottom: 20px;
            color: #dbe7f2;
            font-size: 14px;
        }

        .user-box strong {
            color: white;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }

        input,
        textarea {
            width: 100%;
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            color: white;
            outline: none;
            font-size: 15px;
        }

        input:focus,
        textarea:focus {
            border-color: #4da3ff;
            box-shadow: 0 0 0 3px rgba(77, 163, 255, 0.15);
        }

        input::placeholder,
        textarea::placeholder {
            color: #8fa1b5;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        .amount-box {
            position: relative;
        }

        .amount-box span {
            position: absolute;
            right: 15px;
            top: 14px;
            color: #b9c6d4;
            font-weight: bold;
        }

        .amount-box input {
            padding-right: 60px;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #1687ff, #0066cc);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 5px;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(0, 119, 255, 0.3);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        #sendMessage {
            margin-top: 18px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            display: none;
            font-size: 14px;
        }

        .success {
            display: block !important;
            background: rgba(46, 204, 113, 0.15);
            border: 1px solid rgba(46, 204, 113, 0.4);
            color: #6ff0a5;
        }

        .error {
            display: block !important;
            background: rgba(231, 76, 60, 0.15);
            border: 1px solid rgba(231, 76, 60, 0.4);
            color: #ff8f85;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #8fc7ff;
            text-decoration: none;
            font-size: 14px;
        }

        .back:hover {
            text-decoration: underline;
        }

        @media (max-width: 500px) {
            .container {
                padding: 22px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <img
            src="https://i.postimg.cc/yxKxf5qf/file-000000009b7861f78b615a6a6fe8ae03.png"
            alt="Logo Banque Facile"
            class="logo"
        >

        <h1>Envoyer de l'argent</h1>

        <p class="subtitle">
            Effectuez un transfert rapidement et simplement.
        </p>

        <div class="user-box">
            Compte connecté :
            <strong id="currentUser">Chargement...</strong>
        </div>

        <form id="sendMoneyForm">

            <div class="form-group">
                <label for="recipientName">
                    Nom du bénéficiaire
                </label>

                <input
                    type="text"
                    id="recipientName"
                    name="recipientName"
                    placeholder="Ex : Moussa Diakité"
                    autocomplete="name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="recipientPhone">
                    Numéro de téléphone du bénéficiaire
                </label>

                <input
                    type="tel"
                    id="recipientPhone"
                    name="recipientPhone"
                    placeholder="Ex : 0700000000"
                    autocomplete="tel"
                    required
                >
            </div>

            <div class="form-group">
                <label for="amount">
                    Montant à envoyer
                </label>

                <div class="amount-box">
                    <input
                        type="number"
                        id="amount"
                        name="amount"
                        placeholder="Ex : 5000"
                        min="1"
                        step="1"
                        required
                    >

                    <span>FCFA</span>
                </div>
            </div>

            <div class="form-group">
                <label for="reason">
                    Motif du transfert
                </label>

                <textarea
                    id="reason"
                    name="reason"
                    placeholder="Ex : Paiement, aide familiale..."
                    maxlength="200"
                ></textarea>
            </div>

            <button
                type="submit"
                id="sendButton"
            >
                Envoyer l'argent
            </button>

        </form>

        <div id="sendMessage"></div>

        <a
            href="tableau_de_bord.html"
            class="back"
        >
            ← Retour au tableau de bord
        </a>

    </div>

    <script
        type="module"
        src="envoyer.js"
    ></script>

</body>

</html>
