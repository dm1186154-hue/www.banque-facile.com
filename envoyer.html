<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Envoyer de l'argent | Banque Facile</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #0066cc,
                    #00a8e8
                );

            padding: 30px;

            color: #172033;
        }


        .container {

            width: 100%;

            max-width: 650px;

            margin: 0 auto;
        }


        .card {

            background: white;

            border-radius: 22px;

            padding: 35px;

            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, 0.15);
        }


        .logo {

            width: 85px;

            height: 85px;

            object-fit: contain;

            display: block;

            margin: 0 auto 10px;
        }


        .brand {

            text-align: center;

            color: #006dcc;

            font-size: 24px;

            font-weight: 800;

            margin-bottom: 25px;
        }


        h1 {

            text-align: center;

            color: #006dcc;

            margin-bottom: 8px;
        }


        .subtitle {

            text-align: center;

            color: #64748b;

            margin-bottom: 30px;
        }


        .user-box {

            background: #eff8ff;

            border-radius: 12px;

            padding: 15px;

            margin-bottom: 25px;
        }


        .user-box strong {

            color: #006dcc;
        }


        label {

            display: block;

            margin-bottom: 7px;

            font-weight: 700;

            color: #334155;
        }


        input,
        textarea {

            width: 100%;

            padding: 14px;

            border:
                1px solid
                #d7dee8;

            border-radius: 10px;

            font-size: 15px;

            outline: none;

            margin-bottom: 18px;
        }


        input:focus,
        textarea:focus {

            border-color: #006dcc;

            box-shadow:
                0 0 0 3px
                rgba(0, 109, 204, 0.10);
        }


        textarea {

            min-height: 100px;

            resize: vertical;
        }


        button {

            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 12px;

            background:
                linear-gradient(
                    90deg,
                    #006dcc,
                    #008fe5
                );

            color: white;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s;
        }


        button:hover {

            opacity: 0.92;
        }


        button:disabled {

            opacity: 0.6;

            cursor: not-allowed;
        }


        #sendMessage {

            display: none;

            padding: 14px;

            border-radius: 10px;

            margin-bottom: 20px;

            text-align: center;

            font-weight: 600;
        }


        .back {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #006dcc;

            text-decoration: none;

            font-weight: 700;
        }


        .back:hover {

            text-decoration: underline;
        }


        @media (max-width: 600px) {

            body {

                padding: 15px;
            }


            .card {

                padding:
                    25px
                    20px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <div class="card">


        <img
            class="logo"
            src="https://i.postimg.cc/yxKxf5qf/file-000000009b7861f78b615a6a6fe8ae03.png"
            alt="Logo Banque Facile"
        >


        <div class="brand">
            Banque Facile
        </div>


        <h1>
            💸 Envoyer de l'argent
        </h1>


        <p class="subtitle">
            Effectuez un transfert depuis votre compte.
        </p>


        <div class="user-box">

            Compte connecté :

            <strong id="currentUser">
                Vérification...
            </strong>

        </div>


        <div id="sendMessage"></div>


        <form id="sendMoneyForm">


            <label for="recipientName">
                Nom du bénéficiaire
            </label>


            <input
                type="text"
                id="recipientName"
                placeholder="Ex : Jean Kouassi"
                autocomplete="name"
                required
            >


            <label for="recipientPhone">
                Téléphone du bénéficiaire
            </label>


            <input
                type="tel"
                id="recipientPhone"
                placeholder="Ex : 0700000000"
                autocomplete="tel"
                required
            >


            <label for="amount">
                Montant à envoyer
            </label>


            <input
                type="number"
                id="amount"
                min="1"
                step="1"
                placeholder="Ex : 5000"
                required
            >


            <label for="reason">
                Motif du transfert
            </label>


            <textarea
                id="reason"
                placeholder="Ex : Paiement, aide familiale..."
            ></textarea>


            <button
                type="submit"
                id="sendButton"
            >
                💸 Envoyer l'argent
            </button>


        </form>


        <a
            href="tableau_de_bord.html"
            class="back"
        >
            ← Retour au tableau de bord
        </a>


    </div>


</div>


<script
    type="module"
    src="envoyer.js"
></script>


</body>

</html>
