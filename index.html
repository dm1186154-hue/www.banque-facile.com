<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Banque Facile | Accueil</title>

    <meta
        name="description"
        content="Bienvenue sur Banque Facile, une solution bancaire moderne et simple."
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="page">

        <section class="welcome-card">

            <!-- LOGO -->
            <div class="logo-container">
                <img
                    src="assets/banque_app_logo_final.jpg"
                    alt="Logo Banque Facile"
                    class="logo"
                >
            </div>

            <!-- NOM -->
            <p class="brand">
                BANQUE FACILE
            </p>

            <!-- TITRE -->
            <h1>
                Bienvenue sur<br>
                <span>Banque Facile</span>
            </h1>

            <!-- DESCRIPTION -->
            <p class="description">
                Une solution simple et moderne pour gérer
                votre espace financier en toute simplicité.
            </p>

            <!-- BOUTON CONNEXION -->
            <a
                href="connexion.html"
                class="btn-primary"
            >
                Se connecter
            </a>

            <!-- INSCRIPTION -->
            <p class="register-text">
                Pas encore de compte ?
                <a href="inscription.html">
                    Créer un compte
                </a>
            </p>

        </section>

    </main>

    <footer class="footer">
        <p>© 2026 Banque Facile</p>
    </footer>

</body>
</html>
