<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion | Banque Facile</title>

    <meta name="description"
          content="Connectez-vous à votre espace Banque Facile pour accéder à vos services bancaires numériques.">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;

            background:
                linear-gradient(135deg, #0066cc, #00a8e8);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 25px;
        }

        .container {
            width: 100%;
            max-width: 620px;
        }

        .login-card {
            background: #ffffff;

            border-radius: 24px;

            padding: 45px 44px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.18);

            text-align: center;
        }

        /* LOGO */

        .logo {
            width: 90px;
            height: 90px;

            object-fit: contain;

            display: block;

            margin: 0 auto 25px;
        }

        /* TITRE */

        h1 {
            color: #0068b7;

            font-size: 38px;

            margin-bottom: 12px;

            font-weight: 700;
        }

        .subtitle {
            color: #65758b;

            font-size: 17px;

            line-height: 1.5;

            margin-bottom: 35px;
        }

        /* FORMULAIRE */

        form {
            text-align: left;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;

            color: #172033;

            font-size: 16px;

            font-weight: 700;

            margin-bottom: 9px;
        }

        .input-wrapper {
            position: relative;
        }

        input {
            width: 100%;

            height: 60px;

            border: 1px solid #d5dce5;

            border-radius: 12px;

            padding: 0 18px;

            font-size: 16px;

            color: #172033;

            background: #ffffff;

            outline: none;

            transition: 0.2s;
        }

        input:focus {
            border-color: #0077cc;

            box-shadow:
                0 0 0 3px rgba(0, 119, 204, 0.12);
        }

        input::placeholder {
            color: #8995a5;
        }

        /* BOUTON AFFICHER MOT DE PASSE */

        .toggle-password {
            position: absolute;

            right: 18px;

            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: transparent;

            cursor: pointer;

            font-size: 21px;

            padding: 5px;

            color: #65758b;
        }

        /* MOT DE PASSE OUBLIE */

        .forgot-container {
            text-align: right;

            margin-top: -8px;

            margin-bottom: 25px;
        }

        .forgot-password {
            color: #0068c9;

            text-decoration: none;

            font-weight: 700;

            font-size: 15px;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        /* BOUTON CONNEXION */

        #loginButton {
            width: 100%;

            height: 62px;

            border: none;

            border-radius: 12px;

            background:
                linear-gradient(
                    90deg,
                    #006dcc,
                    #009be6
                );

            color: white;

            font-size: 18px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s;
        }

        #loginButton:hover {
            transform: translateY(-1px);

            box-shadow:
                0 8px 20px rgba(0, 110, 210, 0.25);
        }

        #loginButton:disabled {
            opacity: 0.65;

            cursor: not-allowed;

            transform: none;

            box-shadow: none;
        }

        /* MESSAGE */

        .form-message {
            margin-top: 18px;

            padding: 13px 15px;

            border-radius: 10px;

            font-size: 15px;

            line-height: 1.4;

            text-align: center;

            display: none;
        }

        .form-message:not(:empty) {
            display: block;
        }

        .form-message.success {
            background: #e9f9ef;

            color: #147a3d;

            border: 1px solid #b9e8ca;
        }

        .form-message.error {
            background: #fff0f0;

            color: #b42318;

            border: 1px solid #f4c2c2;
        }

        .form-message.loading {
            background: #eef7ff;

            color: #0068b7;

            border: 1px solid #c9e5fa;
        }

        /* CREATION COMPTE */

        .register-text {
            margin-top: 30px;

            text-align: center;

            color: #65758b;

            font-size: 16px;
        }

        .register-link {
            color: #0068c9;

            font-weight: 700;

            text-decoration: none;
        }

        .register-link:hover {
            text-decoration: underline;
        }

        /* RETOUR ACCUEIL */

        .back-home {
            display: inline-block;

            margin-top: 28px;

            color: #0068c9;

            text-decoration: none;

            font-weight: 700;

            font-size: 16px;
        }

        .back-home:hover {
            text-decoration: underline;
        }

        /* MOBILE */

        @media (max-width: 650px) {

            body {
                padding: 15px;
            }

            .login-card {
                padding: 35px 25px;

                border-radius: 20px;
            }

            h1 {
                font-size: 31px;
            }

            .subtitle {
                font-size: 15px;
            }

            input {
                height: 56px;
            }

            #loginButton {
                height: 58px;
            }

        }

    </style>
</head>


<body>

    <main class="container">

        <section class="login-card">

            <!-- =================================================
                 LOGO BANQUE FACILE
                 ================================================= -->

            <img
                class="logo"
                src="https://i.postimg.cc/yxKxf5qf/file-000000009b7861f78b615a6a6fe8ae03.png"
                alt="Logo Banque Facile"
            >


            <!-- =================================================
                 TITRE
                 ================================================= -->

            <h1>
                Connexion
            </h1>

            <p class="subtitle">
                Connectez-vous à votre espace Banque Facile
                pour accéder à vos services.
            </p>


            <!-- =================================================
                 FORMULAIRE DE CONNEXION
                 ================================================= -->

            <form id="loginForm">


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Adresse e-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="exemple@gmail.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- MOT DE PASSE -->

                <div class="form-group">

                    <label for="password">
                        Mot de passe
                    </label>

                    <div class="input-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Votre mot de passe"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="toggle-password"
                            aria-label="Afficher le mot de passe"
                            title="Afficher / masquer le mot de passe"
                        >
                            👁️
                        </button>

                    </div>

                </div>


                <!-- MOT DE PASSE OUBLIE -->

                <div class="forgot-container">

                    <a
                        href="mot-de-passe-oublie.html"
                        class="forgot-password"
                    >
                        Mot de passe oublié ?
                    </a>

                </div>


                <!-- BOUTON -->

                <button
                    type="submit"
                    id="loginButton"
                >
                    Se connecter
                </button>


                <!-- MESSAGE FIREBASE -->

                <div
                    id="loginMessage"
                    class="form-message"
                    role="alert"
                    aria-live="polite"
                ></div>

            </form>


            <!-- =================================================
                 CREATION DE COMPTE
                 ================================================= -->

            <p class="register-text">

                Vous n'avez pas encore de compte ?

                <a
                    href="inscription.html"
                    class="register-link"
                >
                    Créer un compte
                </a>

            </p>


            <!-- =================================================
                 RETOUR ACCUEIL
                 ================================================= -->

            <a
                href="index.html"
                class="back-home"
            >
                ← Retour à l'accueil
            </a>

        </section>

    </main>


    <!-- =====================================================
         JAVASCRIPT FIREBASE
         ===================================================== -->

    <script type="module" src="connexion.js"></script>

</body>

</html>
