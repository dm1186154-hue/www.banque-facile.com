<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Créez votre compte Banque Facile et gérez votre espace bancaire digital simplement et rapidement.">

    <title>Créer un compte | Banque Facile</title>

    <style>

        /* ==============================
           RÉINITIALISATION
        ============================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* ==============================
           PAGE
        ============================== */

        body {
            font-family: Arial, Helvetica, sans-serif;

            min-height: 100vh;

            background: linear-gradient(
                135deg,
                #0066cc,
                #008fe5,
                #00a8e8
            );

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px 15px;
        }


        /* ==============================
           CONTENEUR
        ============================== */

        .page {
            width: 100%;
            max-width: 620px;
        }


        /* ==============================
           CARTE
        ============================== */

        .welcome-card {
            width: 100%;

            background: #ffffff;

            border-radius: 25px;

            padding: 40px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.20);

            text-align: center;
        }


        /* ==============================
           LOGO BANQUE FACILE
        ============================== */

        .logo {
            width: 95px;
            height: 95px;

            object-fit: contain;

            display: block;

            margin: 0 auto 20px;

            border-radius: 18px;
        }


        /* ==============================
           TITRE
        ============================== */

        h1 {
            color: #0066b3;

            font-size: 36px;

            margin-bottom: 10px;

            font-weight: 700;
        }


        .description {
            color: #667085;

            font-size: 16px;

            line-height: 1.6;

            margin-bottom: 30px;
        }


        /* ==============================
           FORMULAIRE
        ============================== */

        form {
            text-align: left;
        }


        .form-group {
            margin-bottom: 20px;
        }


        label {
            display: block;

            font-size: 16px;

            font-weight: 700;

            color: #101828;

            margin-bottom: 8px;
        }


        input {
            width: 100%;

            height: 56px;

            border: 1px solid #d0d5dd;

            border-radius: 12px;

            padding: 0 17px;

            font-size: 16px;

            outline: none;

            background: #ffffff;

            color: #101828;

            transition:
                border-color 0.2s,
                box-shadow 0.2s;
        }


        input::placeholder {
            color: #98a2b3;
        }


        input:focus {
            border-color: #008fe5;

            box-shadow:
                0 0 0 4px rgba(0, 143, 229, 0.12);
        }


        /* ==============================
           BOUTON
        ============================== */

        .btn-login {
            width: 100%;

            height: 58px;

            border: none;

            border-radius: 12px;

            background: linear-gradient(
                135deg,
                #0066cc,
                #008fe5
            );

            color: #ffffff;

            font-size: 17px;

            font-weight: 700;

            cursor: pointer;

            margin-top: 5px;

            transition:
                transform 0.2s,
                box-shadow 0.2s,
                opacity 0.2s;
        }


        .btn-login:hover {
            transform: translateY(-2px);

            box-shadow:
                0 10px 25px rgba(0, 102, 204, 0.25);
        }


        .btn-login:active {
            transform: translateY(0);
        }


        .btn-login:disabled {
            opacity: 0.65;

            cursor: not-allowed;

            transform: none;

            box-shadow: none;
        }


        /* ==============================
           MESSAGES
        ============================== */

        .form-message {
            width: 100%;

            margin-top: 18px;

            padding: 14px;

            border-radius: 10px;

            text-align: center;

            font-size: 15px;

            font-weight: 600;

            display: none;

            line-height: 1.5;
        }


        .form-message.success {
            display: block;

            background: #ecfdf3;

            color: #027a48;

            border: 1px solid #abefc6;
        }


        .form-message.error {
            display: block;

            background: #fef3f2;

            color: #b42318;

            border: 1px solid #fecdca;
        }


        .form-message.loading {
            display: block;

            background: #eff8ff;

            color: #175cd3;

            border: 1px solid #b2ddff;
        }


        /* ==============================
           CONNEXION
        ============================== */

        .register-text {
            margin-top: 25px;

            color: #667085;

            font-size: 15px;

            text-align: center;
        }


        .register-text a {
            color: #0066cc;

            font-weight: 700;

            text-decoration: none;
        }


        .register-text a:hover {
            text-decoration: underline;
        }


        /* ==============================
           RETOUR ACCUEIL
        ============================== */

        .back-home {
            display: inline-block;

            margin-top: 22px;

            color: #0066cc;

            font-size: 15px;

            font-weight: 600;

            text-decoration: none;
        }


        .back-home:hover {
            text-decoration: underline;
        }


        /* ==============================
           MOBILE
        ============================== */

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .welcome-card {
                padding: 28px 20px;

                border-radius: 20px;
            }

            h1 {
                font-size: 29px;
            }

            .description {
                font-size: 15px;
            }

            input {
                height: 53px;
            }

            .btn-login {
                height: 55px;
            }

            .logo {
                width: 80px;
                height: 80px;
            }
        }

    </style>

</head>


<body>

    <main class="page">

        <section class="welcome-card">


            <!-- ==============================
                 TON LOGO
            ============================== -->

            <img
                class="logo"
                src="https://i.postimg.cc/yxKxf5qf/file-000000009b7861f78b615a6a6fe8ae03.png"
                alt="Logo Banque Facile"
            >


            <!-- ==============================
                 TITRE
            ============================== -->

            <h1>
                Créer un compte
            </h1>


            <p class="description">
                Rejoignez Banque Facile et gérez votre espace
                bancaire digital simplement et rapidement.
            </p>


            <!-- ==============================
                 FORMULAIRE
            ============================== -->

            <form id="registerForm" novalidate>


                <!-- NOM COMPLET -->

                <div class="form-group">

                    <label for="fullname">
                        Nom complet
                    </label>

                    <input
                        type="text"
                        id="fullname"
                        name="fullname"
                        placeholder="Exemple : Diakité Moussa"
                        autocomplete="name"
                        minlength="2"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Adresse e-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="exemple@gmail.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- TÉLÉPHONE -->

                <div class="form-group">

                    <label for="phone">
                        Numéro de téléphone
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Exemple : 0507192851"
                        autocomplete="tel"
                        required
                    >

                </div>


                <!-- MOT DE PASSE -->

                <div class="form-group">

                    <label for="password">
                        Mot de passe
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Minimum 6 caractères"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- CONFIRMATION MOT DE PASSE -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirmer le mot de passe
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirmez votre mot de passe"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- BOUTON -->

                <button
                    type="submit"
                    class="btn-login"
                    id="registerButton"
                >
                    Créer mon compte
                </button>


                <!-- MESSAGE FIREBASE -->

                <div
                    id="registerMessage"
                    class="form-message"
                    aria-live="polite"
                ></div>


            </form>


            <!-- ==============================
                 CONNEXION
            ============================== -->

            <p class="register-text">

                Vous avez déjà un compte ?

                <a href="connexion.html">
                    Se connecter
                </a>

            </p>


            <!-- ==============================
                 RETOUR ACCUEIL
            ============================== -->

            <a
                href="index.html"
                class="back-home"
            >
                ← Retour à l'accueil
            </a>


        </section>

    </main>


    <!-- ==============================
         FIREBASE / JAVASCRIPT
    ============================== -->

    <script
        type="module"
        src="inscription.js">
    </script>


</body>

</html>
