<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Connectez-vous à votre espace Banque Facile.">

    <title>Connexion | Banque Facile</title>


    <style>

        /* =====================================================
           RÉINITIALISATION
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =====================================================
           PAGE
        ===================================================== */

        body {
            font-family: Arial, Helvetica, sans-serif;

            min-height: 100vh;

            background: linear-gradient(
                135deg,
                #0066cc,
                #008fe5,
                #00a8e8
            );

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 30px 15px;
        }


        /* =====================================================
           CONTENEUR
        ===================================================== */

        .page {
            width: 100%;

            max-width: 560px;
        }


        /* =====================================================
           CARTE
        ===================================================== */

        .login-card {
            width: 100%;

            background: #ffffff;

            border-radius: 25px;

            padding: 40px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.20);

            text-align: center;
        }


        /* =====================================================
           LOGO
        ===================================================== */

        .logo {
            width: 95px;

            height: 95px;

            object-fit: contain;

            display: block;

            margin: 0 auto 20px;

            border-radius: 18px;
        }


        /* =====================================================
           TITRE
        ===================================================== */

        h1 {
            color: #0066b3;

            font-size: 36px;

            font-weight: 700;

            margin-bottom: 10px;
        }


        .description {
            color: #667085;

            font-size: 16px;

            line-height: 1.6;

            margin-bottom: 30px;
        }


        /* =====================================================
           FORMULAIRE
        ===================================================== */

        form {
            text-align: left;
        }


        .form-group {
            margin-bottom: 20px;
        }


        label {
            display: block;

            color: #101828;

            font-size: 16px;

            font-weight: 700;

            margin-bottom: 8px;
        }


        input {
            width: 100%;

            height: 56px;

            padding: 0 17px;

            border: 1px solid #d0d5dd;

            border-radius: 12px;

            background: #ffffff;

            color: #101828;

            font-size: 16px;

            outline: none;

            transition:
                border-color 0.2s,
                box-shadow 0.2s;
        }


        input::placeholder {
            color: #98a2b3;
        }


        input:focus {
            border-color: #008fe5;

            box-shadow:
                0 0 0 4px rgba(0, 143, 229, 0.12);
        }


        /* =====================================================
           MOT DE PASSE
        ===================================================== */

        .password-box {
            position: relative;
        }


        .password-box input {
            padding-right: 55px;
        }


        .toggle-password {
            position: absolute;

            right: 16px;

            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: transparent;

            font-size: 20px;

            cursor: pointer;

            padding: 5px;
        }


        /* =====================================================
           MOT DE PASSE OUBLIÉ
        ===================================================== */

        .forgot-password {
            display: block;

            text-align: right;

            margin-top: -8px;

            margin-bottom: 22px;

            color: #0066cc;

            font-size: 14px;

            font-weight: 600;

            text-decoration: none;
        }


        .forgot-password:hover {
            text-decoration: underline;
        }


        /* =====================================================
           BOUTON
        ===================================================== */

        .btn-login {
            width: 100%;

            height: 58px;

            border: none;

            border-radius: 12px;

            background: linear-gradient(
                135deg,
                #0066cc,
                #008fe5
            );

            color: #ffffff;

            font-size: 17px;

            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.2s,
                box-shadow 0.2s,
                opacity 0.2s;
        }


        .btn-login:hover {
            transform: translateY(-2px);

            box-shadow:
                0 10px 25px rgba(0, 102, 204, 0.25);
        }


        .btn-login:active {
            transform: translateY(0);
        }


        .btn-login:disabled {
            opacity: 0.65;

            cursor: not-allowed;

            transform: none;

            box-shadow: none;
        }


        /* =====================================================
           MESSAGE
        ===================================================== */

        .form-message {
            width: 100%;

            margin-top: 18px;

            padding: 14px;

            border-radius: 10px;

            text-align: center;

            font-size: 15px;

            font-weight: 600;

            line-height: 1.5;

            display: none;
        }


        .form-message.success {
            display: block;

            background: #ecfdf3;

            color: #027a48;

            border: 1px solid #abefc6;
        }


        .form-message.error {
            display: block;

            background: #fef3f2;

            color: #b42318;

            border: 1px solid #fecdca;
        }


        .form-message.loading {
            display: block;

            background: #eff8ff;

            color: #175cd3;

            border: 1px solid #b2ddff;
        }


        /* =====================================================
           INSCRIPTION
        ===================================================== */

        .register-text {
            text-align: center;

            margin-top: 25px;

            color: #667085;

            font-size: 15px;
        }


        .register-text a {
            color: #0066cc;

            font-weight: 700;

            text-decoration: none;
        }


        .register-text a:hover {
            text-decoration: underline;
        }


        /* =====================================================
           RETOUR ACCUEIL
        ===================================================== */

        .back-home {
            display: inline-block;

            margin-top: 22px;

            color: #0066cc;

            font-size: 15px;

            font-weight: 600;

            text-decoration: none;
        }


        .back-home:hover {
            text-decoration: underline;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }


            .login-card {
                padding: 28px 20px;

                border-radius: 20px;
            }


            .logo {
                width: 80px;

                height: 80px;
            }


            h1 {
                font-size: 29px;
            }


            .description {
                font-size: 15px;
            }


            input {
                height: 53px;
            }


            .btn-login {
                height: 55px;
            }

        }

    </style>

</head>


<body>


    <main class="page">


        <section class="login-card">


            <!-- =================================================
                 LOGO BANQUE FACILE
            ================================================== -->

            <img
                class="logo"
                src="https://i.postimg.cc/yxKxf5qf/file-000000009b7861f78b615a6a6fe8ae03.png"
                alt="Logo Banque Facile"
            >


            <!-- =================================================
                 TITRE
            ================================================== -->

            <h1>
                Connexion
            </h1>


            <p class="description">
                Connectez-vous à votre espace Banque Facile
                pour accéder à vos services.
            </p>


            <!-- =================================================
                 FORMULAIRE
            ================================================== -->

            <form
                id="loginForm"
                novalidate
            >


                <!-- E-MAIL -->

                <div class="form-group">

                    <label for="email">
                        Adresse e-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="exemple@gmail.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- MOT DE PASSE -->

                <div class="form-group">

                    <label for="password">
                        Mot de passe
                    </label>


                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Votre mot de passe"
                            autocomplete="current-password"
                            required
                        >


                        <button
                            type="button"
                            class="toggle-password"
                            id="togglePassword"
                            aria-label="Afficher le mot de passe"
                        >
                            👁️
                        </button>

                    </div>

                </div>


                <!-- MOT DE PASSE OUBLIÉ -->

                <a
                    href="mot_de_passe_oublie.html"
                    class="forgot-password"
                >
                    Mot de passe oublié ?
                </a>


                <!-- BOUTON -->

                <button
                    type="submit"
                    class="btn-login"
                    id="loginButton"
                >
                    Se connecter
                </button>


                <!-- MESSAGE -->

                <div
                    id="loginMessage"
                    class="form-message"
                    aria-live="polite"
                ></div>


            </form>


            <!-- =================================================
                 INSCRIPTION
            ================================================== -->

            <p class="register-text">

                Vous n'avez pas encore de compte ?

                <a href="inscription.html">
                    Créer un compte
                </a>

            </p>


            <!-- =================================================
                 RETOUR ACCUEIL
            ================================================== -->

            <a
                href="index.html"
                class="back-home"
            >
                ← Retour à l'accueil
            </a>


        </section>


    </main>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script
        type="module"
        src="connexion.js">
    </script>


</body>

</html>
