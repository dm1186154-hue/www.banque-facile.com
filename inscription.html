<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Créer un compte | Banque Facile</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="page">

        <section class="welcome-card">

            <!-- LOGO -->
            <img
                src="assets/banque_app_logo_final.jpg"
                alt="Logo Banque Facile"
                class="logo"
            >

            <!-- TITRE -->
            <h1>
                Créer un compte<br>
                <span>Banque Facile</span>
            </h1>

            <p class="description">
                Créez votre compte et commencez à gérer
                vos opérations simplement.
            </p>

            <!-- FORMULAIRE -->
            <form id="registerForm">

                <div class="form-group">
                    <label for="fullname">Nom complet</label>

                    <input
                        type="text"
                        id="fullname"
                        name="fullname"
                        placeholder="Votre nom complet"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Adresse e-mail</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Votre adresse e-mail"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="phone">Numéro de téléphone</label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Votre numéro de téléphone"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Mot de passe</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Créer un mot de passe"
                        minlength="6"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword">
                        Confirmer le mot de passe
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirmer votre mot de passe"
                        minlength="6"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="btn-login"
                >
                    Créer mon compte
                </button>

                <div
                    id="registerMessage"
                    class="form-message"
                ></div>

            </form>

            <!-- CONNEXION -->

            <p class="register-text">

                Vous avez déjà un compte ?

                <a href="connexion.html">
                    Se connecter
                </a>

            </p>

            <!-- RETOUR -->

            <a
                href="index.html"
                class="back-home"
            >
                ← Retour à l'accueil
            </a>

        </section>

    </main>

    <!-- JAVASCRIPT -->

    <script type="module" src="js/auth.js"></script>

</body>

</html>
