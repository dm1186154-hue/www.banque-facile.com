<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inscription | Banque Facile</title>

    <meta
        name="description"
        content="Créez votre compte Banque Facile."
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="header">

    <div class="container nav">

        <a href="index.html" class="logo">

            <img
                src="assets/banque-facile-logo.jpg"
                alt="Logo Banque Facile"
            >

            <span>Banque Facile</span>

        </a>

        <nav class="navigation">

            <a href="index.html">
                Accueil
            </a>

            <a href="connexion.html">
                Connexion
            </a>

        </nav>

    </div>

</header>


<main>

<section class="hero">

<div class="container">

<div class="section-title">

<span>BANQUE FACILE</span>

<h1>Créer un compte</h1>

<p>
Rejoignez Banque Facile et créez votre espace bancaire.
</p>

</div>


<div class="login-container">

<div class="login-card">

<div class="login-logo">

<img
    src="assets/banque-facile-logo.jpg"
    alt="Logo officiel Banque Facile"
>

</div>


<h2>Inscription</h2>

<p class="login-subtitle">
Remplissez les informations ci-dessous.
</p>


<form id="registerForm">


<div class="form-group">

<label for="fullname">
Nom complet
</label>

<input
    type="text"
    id="fullname"
    name="fullname"
    placeholder="Votre nom complet"
    autocomplete="name"
    required
>

</div>


<div class="form-group">

<label for="email">
Adresse e-mail
</label>

<input
    type="email"
    id="email"
    name="email"
    placeholder="exemple@email.com"
    autocomplete="email"
    required
>

</div>


<div class="form-group">

<label for="phone">
Numéro de téléphone
</label>

<input
    type="tel"
    id="phone"
    name="phone"
    placeholder="+225 XX XX XX XX XX"
    autocomplete="tel"
    required
>

</div>


<div class="form-group">

<label for="password">
Mot de passe
</label>

<input
    type="password"
    id="password"
    name="password"
    placeholder="Créer un mot de passe"
    autocomplete="new-password"
    minlength="8"
    required
>

</div>


<div class="form-group">

<label for="confirmPassword">
Confirmer le mot de passe
</label>

<input
    type="password"
    id="confirmPassword"
    name="confirmPassword"
    placeholder="Confirmer le mot de passe"
    autocomplete="new-password"
    minlength="8"
    required
>

</div>


<div class="form-group">

<label>

<input
    type="checkbox"
    id="terms"
    required
>

 J'accepte les conditions d'utilisation.

</label>

</div>


<button
    type="submit"
    class="btn-primary login-button"
>
    Créer mon compte
</button>


<div
    id="registerMessage"
    class="form-message"
    aria-live="polite"
></div>


</form>


<div class="register-link">

<p>
Vous avez déjà un compte ?
</p>

<a href="connexion.html">
Se connecter
</a>

</div>

</div>

</div>

</div>

</section>

</main>


<footer class="footer">

<div class="footer-bottom">

<p>
© 2026 Banque Facile - Tous droits réservés.
</p>

</div>

</footer>

</body>

</html>
