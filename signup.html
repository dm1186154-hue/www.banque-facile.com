<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Créer un compte | Banque Facile</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0066cc, #00a8e8);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .container {
            width: 100%;
            max-width: 560px;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .logo {
            display: block;
            width: 75px;
            height: 75px;
            object-fit: contain;
            margin: 0 auto 15px;
        }

        h1 {
            text-align: center;
            color: #0066b3;
            font-size: 36px;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #667085;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            color: #172033;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 1px solid #d0d7e2;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #008ee8;
            box-shadow: 0 0 0 3px rgba(0, 142, 232, 0.12);
        }

        .password-container {
            position: relative;
        }

        .password-container input {
            padding-right: 50px;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 20px;
            user-select: none;
        }

        button {
            width: 100%;
            border: none;
            padding: 16px;
            border-radius: 10px;
            background: linear-gradient(90deg, #0077cc, #009fe3);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(0, 119, 204, 0.25);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            display: none;
            margin-top: 18px;
            padding: 13px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
        }

        .message.success {
            display: block;
            background: #e8f7ed;
            color: #16803c;
        }

        .message.error {
            display: block;
            background: #fdecec;
            color: #c62828;
        }

        .login {
            text-align: center;
            margin-top: 25px;
            color: #667085;
        }

        .login a {
            color: #006fc9;
            font-weight: bold;
            text-decoration: none;
        }

        .login a:hover {
            text-decoration: underline;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #006fc9;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px 20px;
            }

            h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <img
            src="banque_app_logo_final.jpg"
            alt="Logo Banque Facile"
            class="logo"
        >

        <h1>Créer un compte</h1>

        <p class="description">
            Rejoignez Banque Facile et gérez votre espace bancaire digital
            simplement et rapidement.
        </p>

        <form id="registerForm">

            <!-- NOM -->
            <div class="form-group">
                <label for="fullname">Nom complet</label>

                <input
                    type="text"
                    id="fullname"
                    placeholder="Exemple : Diakité Moussa"
                    autocomplete="name"
                    required
                >
            </div>

            <!-- EMAIL -->
            <div class="form-group">
                <label for="email">Adresse e-mail</label>

                <input
                    type="email"
                    id="email"
                    placeholder="exemple@gmail.com"
                    autocomplete="email"
                    required
                >
            </div>

            <!-- TELEPHONE -->
            <div class="form-group">
                <label for="phone">Numéro de téléphone</label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Exemple : 0507192851"
                    autocomplete="tel"
                    required
                >
            </div>

            <!-- MOT DE PASSE -->
            <div class="form-group">
                <label for="password">Mot de passe</label>

                <div class="password-container">

                    <input
                        type="password"
                        id="password"
                        placeholder="Minimum 6 caractères"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                    <span
                        class="toggle-password"
                        onclick="togglePassword('password', this)"
                    >
                        👁️
                    </span>

                </div>
            </div>

            <!-- CONFIRMATION -->
            <div class="form-group">
                <label for="confirmPassword">
                    Confirmer le mot de passe
                </label>

                <div class="password-container">

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirmez votre mot de passe"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                    <span
                        class="toggle-password"
                        onclick="togglePassword('confirmPassword', this)"
                    >
                        👁️
                    </span>

                </div>
            </div>

            <!-- BOUTON -->
            <button
                type="submit"
                id="registerButton"
            >
                Créer mon compte
            </button>

            <!-- MESSAGE -->
            <div
                id="registerMessage"
                class="message"
            ></div>

        </form>

        <p class="login">
            Vous avez déjà un compte ?
            <a href="connexion.html">
                Se connecter
            </a>
        </p>

        <a
            href="index.html"
            class="back"
        >
            ← Retour à l'accueil
        </a>

    </main>

    <!-- JAVASCRIPT -->
    <script type="module" src="inscription.js"></script>

</body>

</html>
