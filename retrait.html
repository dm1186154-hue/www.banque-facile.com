<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Retrait | Banque Facile</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<header class="header">

<div class="container nav">

<a href="index.html" class="logo">

<img
src="assets/banque-facile-logo.jpg"
alt="Logo Banque Facile"
>

<span>Banque Facile</span>

</a>

<nav class="navigation">

<a href="tableau-de-bord.html">
Tableau de bord
</a>

<a href="historique.html">
Historique
</a>

</nav>

</div>

</header>


<main>

<section class="hero">

<div class="container">

<div class="section-title">

<span>OPÉRATION</span>

<h1>Retrait d'argent</h1>

<p>
Effectuez une demande de retrait depuis votre compte.
</p>

</div>


<div class="login-container">

<div class="login-card">

<form id="withdrawForm">


<div class="form-group">

<label for="withdrawAmount">
Montant du retrait
</label>

<input
type="number"
id="withdrawAmount"
placeholder="Montant en FCFA"
min="1"
required
>

</div>


<div class="form-group">

<label for="withdrawMethod">
Méthode de retrait
</label>

<select
id="withdrawMethod"
required
style="width:100%;padding:14px;border:1px solid #d5dce7;border-radius:9px;"
>

<option value="">
Choisir une méthode
</option>

<option value="orange-money">
Orange Money
</option>

<option value="wave">
Wave
</option>

<option value="mtn-money">
MTN Money
</option>

</select>

</div>


<button
type="submit"
class="btn-primary login-button"
>
Continuer
</button>


<div
id="withdrawMessage"
class="form-message"
></div>


</form>

</div>

</div>

</div>

</section>

</main>


<footer class="footer">

<div class="footer-bottom">

<p>
© 2026 Banque Facile - Tous droits réservés.
</p>

</div>

</footer>

</body>

</html>
