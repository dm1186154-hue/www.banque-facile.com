<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact | Banque Facile</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<header class="header">

<div class="container nav">

<a href="index.html" class="logo">

<img
src="assets/banque-facile-logo.jpg"
alt="Logo Banque Facile"
>

<span>Banque Facile</span>

</a>

<nav class="navigation">

<a href="index.html">
Accueil
</a>

<a href="apropos.html">
À propos
</a>

<a href="contact.html" class="active">
Contact
</a>

<a href="connexion.html" class="btn-login">
Connexion
</a>

</nav>

</div>

</header>


<main>

<section class="hero">

<div class="container">

<div class="section-title">

<span>ASSISTANCE</span>

<h1>Contactez-nous</h1>

<p>
Notre équipe est là pour répondre à vos questions.
</p>

</div>


<div class="login-container">

<div class="login-card">

<form id="contactForm">


<div class="form-group">

<label for="contactName">
Nom complet
</label>

<input
type="text"
id="contactName"
placeholder="Votre nom"
required
>

</div>


<div class="form-group">

<label for="contactEmail">
Adresse e-mail
</label>

<input
type="email"
id="contactEmail"
placeholder="exemple@email.com"
required
>

</div>


<div class="form-group">

<label for="contactMessage">
Votre message
</label>

<textarea
id="contactMessage"
placeholder="Écrivez votre message..."
required
style="
width:100%;
min-height:150px;
padding:14px;
border:1px solid #d5dce7;
border-radius:9px;
resize:vertical;
"
></textarea>

</div>


<button
type="submit"
class="btn-primary login-button"
>
Envoyer le message
</button>


<div
id="contactResult"
class="form-message"
></div>


</form>

</div>

</div>

</div>

</section>

</main>


<footer class="footer">

<div class="footer-bottom">

<p>
© 2026 Banque Facile - Tous droits réservés.
</p>

</div>

</footer>

</body>

</html>
